<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Codex 思维链</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --body: #c9cfdb;
      --muted: #8b93a5;
      --hover-line: #3a4150;
      --blue: #6ea8ff;
      --green: #7ddc9b;
      --orange: #e8a45c;
      --pink: #f08ab0;
    }
    :root[data-theme="light"] {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e2e5ea;
      --text: #1f2430;
      --body: #2c3442;
      --muted: #68707f;
      --hover-line: #c7ccd6;
      --blue: #2f6fed;
      --green: #148f4d;
      --orange: #b26a05;
      --pink: #c2437a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      user-select: none;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
    }
    .spacer { flex: 1; }
    .status {
      color: var(--muted);
      font-size: 11px;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { color: var(--text); border-color: var(--hover-line); }
    button.on { color: var(--blue); border-color: var(--blue); }
    .filters {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
      flex-wrap: wrap;
    }
    .filters button { padding: 3px 8px; }
    .searchbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      align-items: center;
    }
    .searchbar input {
      flex: 1;
      min-width: 60px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .searchbar input:focus { border-color: var(--blue); }
    .searchbar button.toggle {
      width: 20px;
      height: 20px;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 600;
      font-family: Consolas, "Cascadia Mono", monospace;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .searchbar button.toggle:hover {
      background: color-mix(in srgb, var(--muted) 22%, transparent);
      color: var(--text);
      border-color: transparent;
    }
    .searchbar button.toggle.on {
      background: color-mix(in srgb, var(--blue) 32%, transparent);
      color: var(--blue);
      border-color: transparent;
    }
    .searchbar .count {
      color: var(--muted);
      font-size: 11px;
      min-width: 44px;
      text-align: center;
      white-space: nowrap;
    }
    .searchbar .count.error { color: #f14c4c; }
    .chips {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .chips:empty { display: none; }
    .chip {
      flex: 0 0 auto;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11px;
      cursor: pointer;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip:hover { color: var(--orange); border-color: var(--orange); }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 20px;
    }
    .item {
      border-left: 2px solid var(--line);
      padding: 6px 10px 6px 12px;
      margin: 0 0 10px;
      border-radius: 0 6px 6px 0;
      background: var(--panel);
      white-space: pre-wrap;
      word-break: break-word;
      animation: pop 0.15s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .tag {
      font-size: 10px;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .reasoning { border-left-color: var(--blue); }
    .reasoning .tag { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
    .assistant { border-left-color: var(--green); }
    .assistant .tag { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .tool { border-left-color: var(--orange); }
    .tool .tag { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
    .user { border-left-color: var(--pink); }
    .user .tag { color: var(--pink); background: color-mix(in srgb, var(--pink) 14%, transparent); }
    .system { border-left-color: var(--muted); color: var(--muted); font-size: 11px; }
    .item .body { font-size: 12px; color: var(--body); }
    .item .body mark {
      background: color-mix(in srgb, var(--orange) 26%, transparent);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
      outline: 1px solid color-mix(in srgb, var(--orange) 45%, transparent);
    }
    .item .body mark.current {
      background: color-mix(in srgb, var(--orange) 60%, transparent);
    }
    .item.flash { animation: flash 1.2s ease-out; }
    @keyframes flash {
      0% { background: color-mix(in srgb, var(--orange) 35%, transparent); }
      100% { background: var(--panel); }
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 10px;
      font-size: 12px;
    }
    /* Electron frameless window: the header drags the window; all window
       edges/corners resize natively. Ignored in normal browsers. */
    header { -webkit-app-region: drag; }
    header button, header input { -webkit-app-region: no-drag; }
  </style>
</head>
<body>
  <header>
    <h1>Codex 思维链</h1>
    <div class="spacer"></div>
    <span class="status" id="status">连接中...</span>
    <button id="tools-toggle" class="on" title="工具调用索引">调用</button>
    <button id="pin" class="on" title="取消置顶" hidden>📌</button>
    <button id="theme" title="切换主题">自动</button>
    <button id="pause">暂停</button>
    <button id="clear">清空</button>
    <button id="close" title="关闭悬浮窗" hidden>✕</button>
  </header>
  <div class="searchbar" id="searchbar" hidden>
    <input id="search-input" type="text" placeholder="查找内容…（Enter 下一个 · Shift+Enter 上一个 · Esc 关闭）">
    <button class="toggle" id="opt-case" title="区分大小写 (Alt+C)">Aa</button>
    <button class="toggle" id="opt-word" title="全字匹配 (Alt+W)">ab|</button>
    <button class="toggle" id="opt-regex" title="使用正则表达式 (Alt+R)">.*</button>
    <span class="count" id="search-count"></span>
    <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
    <button id="search-next" title="下一个 (Enter)">↓</button>
    <button id="search-close" title="关闭 (Esc)">✕</button>
  </div>
  <div class="filters">
    <button data-filter="reasoning" class="on">思考</button>
    <button data-filter="assistant" class="on">回复</button>
    <button data-filter="tool" class="on">工具</button>
    <button data-filter="user" class="on">我</button>
  </div>
  <div class="chips" id="chips"></div>
  <main id="feed">
    <div class="empty">等待思维链...</div>
  </main>
  <script>
    const feed = document.getElementById('feed');
    const status = document.getElementById('status');
    const pauseBtn = document.getElementById('pause');
    const clearBtn = document.getElementById('clear');
    const themeBtn = document.getElementById('theme');
    const closeBtn = document.getElementById('close');
    const toolsToggleBtn = document.getElementById('tools-toggle');
    const pinBtn = document.getElementById('pin');
    const searchbar = document.getElementById('searchbar');
    const searchInput = document.getElementById('search-input');
    const searchCount = document.getElementById('search-count');
    const searchPrevBtn = document.getElementById('search-prev');
    const searchNextBtn = document.getElementById('search-next');
    const searchCloseBtn = document.getElementById('search-close');
    const optCaseBtn = document.getElementById('opt-case');
    const optWordBtn = document.getElementById('opt-word');
    const optRegexBtn = document.getElementById('opt-regex');
    const chips = document.getElementById('chips');
    // All four kinds are enabled by default.
    const filters = new Set(['reasoning', 'assistant', 'tool', 'user']);
    let paused = false;
    let autoScroll = true;
    let queue = [];
    let playing = false;
    // Registry of rendered entries, used by search and the tool-call index.
    const allItems = [];
    let searchHits = [];
    let searchCur = 0;
    let activeMatcher = null;
    // VSCode-style search options
    const searchOpts = { caseSensitive: false, wholeWord: false, regex: false };

    // ---- Theme: auto follows the OS, manual choice is persisted ----
    const THEME_KEY = 'codex-reasoning-sidebar-theme';
    const THEME_ORDER = ['auto', 'light', 'dark'];
    const THEME_LABEL = { auto: '自动', light: '浅色', dark: '深色' };
    const media = matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(mode) {
      const dark = mode === 'dark' || (mode === 'auto' && media.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeBtn.textContent = THEME_LABEL[mode];
      themeBtn.classList.toggle('on', mode !== 'auto');
    }
    let themeMode = THEME_ORDER.includes(localStorage.getItem(THEME_KEY))
      ? localStorage.getItem(THEME_KEY)
      : 'auto';
    applyTheme(themeMode);
    media.addEventListener('change', () => {
      if (themeMode === 'auto') applyTheme('auto');
    });
    themeBtn.addEventListener('click', () => {
      themeMode = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
      localStorage.setItem(THEME_KEY, themeMode);
      applyTheme(themeMode);
    });

    // Inside the Electron floating window, show an in-page close button.
    // (Window dragging and 8-direction edge resize are handled natively.)
    if (window.sidebar && window.sidebar.quit) {
      closeBtn.hidden = false;
      closeBtn.addEventListener('click', () => window.sidebar.quit());
    }

    // Pin toggle: control always-on-top (Electron window only).
    if (window.sidebar && window.sidebar.setPinned) {
      pinBtn.hidden = false;
      const setPinUI = (v) => {
        pinBtn.classList.toggle('on', v);
        pinBtn.title = v ? '取消置顶' : '窗口置顶';
      };
      pinBtn.addEventListener('click', () => {
        window.sidebar.setPinned(!pinBtn.classList.contains('on'));
      });
      if (window.sidebar.onPinned) window.sidebar.onPinned(setPinUI);
    }

    function fmt(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // Scroll an entry into view and flash it; reveal it if its filter is off.
    function locate(el) {
      if (!el || !el.isConnected) return;
      if (el.style.display === 'none') el.style.display = '';
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('flash');
    }

    function restoreBody(el) {
      const body = el && el.querySelector('.body');
      if (body && el.dataset.done && el._text !== undefined) body.textContent = el._text;
    }

    function applyMarks(el) {
      const body = el && el.querySelector('.body');
      if (!body || !el.dataset.done || el._text === undefined) return;
      const text = el._text;
      const mine = searchHits.filter((h) => h.el === el);
      if (!mine.length || !activeMatcher || activeMatcher.error) {
        body.textContent = text;
        return;
      }
      let html = '';
      let pos = 0;
      for (const h of mine) {
        const isCur = searchHits[searchCur] === h;
        html += esc(text.slice(pos, h.start))
          + '<mark' + (isCur ? ' class="current"' : '') + '>'
          + esc(text.slice(h.start, h.end)) + '</mark>';
        pos = h.end;
      }
      html += esc(text.slice(pos));
      body.innerHTML = html;
    }

    function updateSearchCount() {
      if (activeMatcher && activeMatcher.error) {
        searchCount.textContent = '正则无效';
        searchCount.classList.add('error');
        return;
      }
      searchCount.classList.remove('error');
      const q = searchInput.value;
      searchCount.textContent = searchHits.length
        ? (searchCur + 1) + '/' + searchHits.length
        : (q.trim() ? '0/0' : '');
    }

    // Build a matcher honoring the three VSCode-style options.
    function createMatcher(query, opts) {
      if (!query) return null;
      try {
        let source;
        if (opts.regex) {
          source = opts.wholeWord ? '\\b(?:' + query + ')\\b' : query;
        } else {
          const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          source = opts.wholeWord ? '\\b(?:' + escaped + ')\\b' : escaped;
        }
        const flags = opts.caseSensitive ? 'g' : 'gi';
        return { re: new RegExp(source, flags), error: null };
      } catch (err) {
        return { re: null, error: err.message };
      }
    }

    function collectHits(re) {
      const hits = [];
      for (const it of allItems) {
        re.lastIndex = 0;
        let m;
        while ((m = re.exec(it.text)) !== null) {
          if (m[0] !== '') hits.push({ el: it.el, start: m.index, end: m.index + m[0].length });
          else re.lastIndex++; // zero-length match safety
        }
      }
      return hits;
    }

    function runSearch(opts = {}) {
      const keepCur = !!opts.keepCur;
      const jump = opts.jump !== false;
      for (const it of allItems) restoreBody(it.el);
      activeMatcher = createMatcher(searchInput.value, searchOpts);
      if (!activeMatcher || activeMatcher.error) {
        searchHits = [];
        searchCur = 0;
        updateSearchCount();
        return;
      }
      searchHits = collectHits(activeMatcher.re);
      if (!keepCur || searchCur >= searchHits.length) searchCur = 0;
      const touched = new Set(searchHits.map((h) => h.el));
      for (const el of touched) applyMarks(el);
      updateSearchCount();
      if (jump && searchHits.length) locate(searchHits[searchCur].el);
    }

    function stepSearch(dir) {
      if (!searchHits.length) return;
      searchCur = (searchCur + dir + searchHits.length) % searchHits.length;
      updateSearchCount();
      locate(searchHits[searchCur].el);
      const touched = new Set(searchHits.map((h) => h.el));
      for (const el of touched) applyMarks(el);
    }

    function openSearch() {
      searchbar.hidden = false;
      searchInput.focus();
      searchInput.select();
      if (searchInput.value) runSearch({ jump: true });
    }

    function closeSearch() {
      searchbar.hidden = true;
      activeMatcher = null;
      searchHits = [];
      searchCur = 0;
      updateSearchCount();
      for (const it of allItems) restoreBody(it.el);
    }

    function addToolChip(item, el) {
      if (chips.hidden) return;
      const chip = document.createElement('button');
      chip.className = 'chip';
      const name = item.text.slice(0, item.text.indexOf('(')).trim() || item.text.slice(0, 24);
      chip.textContent = fmt(item.ts) + ' ' + name;
      chip.title = item.text.slice(0, 300);
      chip.addEventListener('click', () => locate(el));
      chips.appendChild(chip);
      while (chips.children.length > 30) chips.firstElementChild.remove();
      chips.scrollLeft = chips.scrollWidth;
    }

    function renderTyping(item, done) {
      const empty = feed.querySelector('.empty');
      if (empty) empty.remove();
      const el = document.createElement('div');
      el.className = 'item ' + item.kind;
      const label = {
        reasoning: '思考',
        assistant: '回复',
        tool: '工具',
        user: '我',
        system: '系统',
      }[item.kind] || item.kind;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      const time = document.createElement('span');
      time.textContent = fmt(item.ts);
      meta.append(tag, time);
      const body = document.createElement('div');
      body.className = 'body';
      el.append(meta, body);
      feed.appendChild(el);
      el._text = item.text;
      allItems.push({ kind: item.kind, ts: item.ts, text: item.text, el });
      while (allItems.length > 300) allItems.shift();
      if (item.kind === 'tool') addToolChip(item, el);
      while (feed.children.length > 300) feed.firstElementChild.remove();

      const text = item.text;
      const step = text.length > 400 ? 3 : 2;
      const speed = text.length > 400 ? 10 : 16;
      let idx = 0;
      let finished = false;

      const finish = () => {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        body.textContent = text;
        el.dataset.done = '1';
        if (!searchbar.hidden && searchInput.value.trim()) {
          runSearch({ keepCur: true, jump: false });
        }
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        done();
      };

      const timer = setInterval(() => {
        if (paused) return;
        idx = Math.min(text.length, idx + step);
        body.textContent = text.slice(0, idx);
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        if (idx >= text.length) finish();
      }, speed);

      el.addEventListener('click', finish);
    }

    function playNext() {
      if (paused) return;
      if (!queue.length) {
        playing = false;
        return;
      }
      playing = true;
      const item = queue.shift();
      renderTyping(item, playNext);
    }

    function enqueue(item) {
      if (!filters.has(item.kind)) return;
      queue.push(item);
      if (!playing) playNext();
    }

    function applyFilters() {
      for (const el of feed.querySelectorAll('.item')) {
        el.style.display = filters.has(el.classList[1]) || filters.has('system') && el.classList.contains('system') ? '' : 'none';
      }
    }

    document.querySelectorAll('.filters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.filter;
        if (filters.has(key)) { filters.delete(key); btn.classList.remove('on'); }
        else { filters.add(key); btn.classList.add('on'); }
        applyFilters();
      });
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? '继续' : '暂停';
      pauseBtn.classList.toggle('on', paused);
      if (!paused && !playing && queue.length) playNext();
    });

    clearBtn.addEventListener('click', () => {
      queue = [];
      playing = false;
      feed.innerHTML = '<div class="empty">已清空</div>';
      allItems.length = 0;
      chips.innerHTML = '';
      searchHits = [];
      searchCur = 0;
      updateSearchCount();
    });

    toolsToggleBtn.addEventListener('click', () => {
      chips.hidden = !chips.hidden;
      toolsToggleBtn.classList.toggle('on', !chips.hidden);
      if (!chips.hidden) {
        chips.innerHTML = '';
        for (const it of allItems) {
          if (it.kind === 'tool') addToolChip(it, it.el);
        }
      }
    });

    searchInput.addEventListener('input', () => runSearch(false));
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); stepSearch(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
      else if (e.key === 'F3') { e.preventDefault(); stepSearch(1); }
    });
    searchPrevBtn.addEventListener('click', () => stepSearch(-1));
    searchNextBtn.addEventListener('click', () => stepSearch(1));
    searchCloseBtn.addEventListener('click', closeSearch);

    function toggleSearchOpt(btn, key) {
      searchOpts[key] = !searchOpts[key];
      btn.classList.toggle('on', searchOpts[key]);
      runSearch({ jump: true });
    }
    optCaseBtn.addEventListener('click', () => toggleSearchOpt(optCaseBtn, 'caseSensitive'));
    optWordBtn.addEventListener('click', () => toggleSearchOpt(optWordBtn, 'wholeWord'));
    optRegexBtn.addEventListener('click', () => toggleSearchOpt(optRegexBtn, 'regex'));

    document.addEventListener('keydown', (e) => {
      if (searchbar.hidden || !e.altKey || e.ctrlKey || e.metaKey) return;
      const entry = {
        KeyC: [optCaseBtn, 'caseSensitive'],
        KeyW: [optWordBtn, 'wholeWord'],
        KeyR: [optRegexBtn, 'regex'],
      }[e.code];
      if (!entry) return;
      e.preventDefault();
      toggleSearchOpt(entry[0], entry[1]);
    });

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        openSearch();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'g' || e.key === 'G')) {
        e.preventDefault();
        if (!searchbar.hidden) stepSearch(1);
      } else if (e.key === 'F3') {
        e.preventDefault();
        if (!searchbar.hidden) stepSearch(1);
      } else if (e.key === 'Escape' && !searchbar.hidden && document.activeElement !== searchInput) {
        closeSearch();
      }
    });

    feed.addEventListener('scroll', () => {
      autoScroll = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 30;
    });

    const es = new EventSource('/events');
    es.onmessage = (ev) => {
      const item = JSON.parse(ev.data);
      if (item.kind === 'system') {
        status.textContent = item.text;
        return;
      }
      enqueue(item);
    };
    es.onerror = () => {
      status.textContent = '连接断开，重连中...';
    };
    fetch('/api/session').then((r) => r.json()).then((d) => {
      if (!d.session) return;
      const short = d.session.slice(0, 4) + '…' + d.session.slice(-4);
      status.textContent = (d.label ? `已监听 ${d.label}（${short}）` : `已监听会话 ${short}`);
    }).catch(() => {});
  </script>
</body>
</html>
