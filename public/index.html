<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Codex 思维链</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --body: #c9cfdb;
      --muted: #8b93a5;
      --hover-line: #3a4150;
      --blue: #6ea8ff;
      --green: #7ddc9b;
      --orange: #e8a45c;
      --pink: #f08ab0;
    }
    :root[data-theme="light"] {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #e2e5ea;
      --text: #1f2430;
      --body: #2c3442;
      --muted: #68707f;
      --hover-line: #c7ccd6;
      --blue: #2f6fed;
      --green: #148f4d;
      --orange: #b26a05;
      --pink: #c2437a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      user-select: none;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
      white-space: nowrap;
    }
    .spacer { flex: 1; }
    .status {
      color: var(--muted);
      font-size: 11px;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { color: var(--text); border-color: var(--hover-line); }
    button.on { color: var(--blue); border-color: var(--blue); }
    .filters {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
      flex-wrap: wrap;
    }
    .filters button { padding: 3px 8px; }
    .searchbar {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      align-items: center;
    }
    .searchbar input {
      flex: 1;
      min-width: 60px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .searchbar input:focus { border-color: var(--blue); }
    .searchbar .count {
      color: var(--muted);
      font-size: 11px;
      min-width: 44px;
      text-align: center;
      white-space: nowrap;
    }
    .chips {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .chips:empty { display: none; }
    .chip {
      flex: 0 0 auto;
      background: var(--bg);
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 11px;
      cursor: pointer;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chip:hover { color: var(--orange); border-color: var(--orange); }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 20px;
    }
    .item {
      border-left: 2px solid var(--line);
      padding: 6px 10px 6px 12px;
      margin: 0 0 10px;
      border-radius: 0 6px 6px 0;
      background: var(--panel);
      white-space: pre-wrap;
      word-break: break-word;
      animation: pop 0.15s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .tag {
      font-size: 10px;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .reasoning { border-left-color: var(--blue); }
    .reasoning .tag { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
    .assistant { border-left-color: var(--green); }
    .assistant .tag { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
    .tool { border-left-color: var(--orange); }
    .tool .tag { color: var(--orange); background: color-mix(in srgb, var(--orange) 14%, transparent); }
    .user { border-left-color: var(--pink); }
    .user .tag { color: var(--pink); background: color-mix(in srgb, var(--pink) 14%, transparent); }
    .system { border-left-color: var(--muted); color: var(--muted); font-size: 11px; }
    .item .body { font-size: 12px; color: var(--body); }
    .item .body mark {
      background: color-mix(in srgb, var(--orange) 45%, transparent);
      color: inherit;
      border-radius: 2px;
      padding: 0 1px;
    }
    .item.flash { animation: flash 1.2s ease-out; }
    @keyframes flash {
      0% { background: color-mix(in srgb, var(--orange) 35%, transparent); }
      100% { background: var(--panel); }
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 10px;
      font-size: 12px;
    }
    .grip {
      position: fixed;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      z-index: 10;
      background: linear-gradient(135deg, transparent 0 50%, var(--line) 50% 100%);
      border-top-left-radius: 4px;
    }
  </style>
</head>
<body>
  <header class="pywebview-drag-region">
    <h1>Codex 思维链</h1>
    <div class="spacer"></div>
    <span class="status" id="status">连接中...</span>
    <button id="tools-toggle" class="on" title="工具调用索引">调用</button>
    <button id="search-toggle" title="查找 (Ctrl+F)">查找</button>
    <button id="theme" title="切换主题">自动</button>
    <button id="pause">暂停</button>
    <button id="clear">清空</button>
    <button id="close" title="关闭悬浮窗" hidden>✕</button>
  </header>
  <div class="searchbar" id="searchbar" hidden>
    <input id="search-input" type="text" placeholder="查找内容…（Enter 下一个 · Shift+Enter 上一个 · Esc 关闭）">
    <span class="count" id="search-count"></span>
    <button id="search-prev" title="上一个 (Shift+Enter)">↑</button>
    <button id="search-next" title="下一个 (Enter)">↓</button>
    <button id="search-close" title="关闭 (Esc)">✕</button>
  </div>
  <div class="filters">
    <button data-filter="reasoning" class="on">思考</button>
    <button data-filter="assistant" class="on">回复</button>
    <button data-filter="tool" class="on">工具</button>
    <button data-filter="user" class="on">我</button>
  </div>
  <div class="chips" id="chips"></div>
  <main id="feed">
    <div class="empty">等待思维链...</div>
  </main>
  <div class="grip" id="grip" hidden title="拖动调整悬浮窗大小"></div>
  <script>
    const feed = document.getElementById('feed');
    const status = document.getElementById('status');
    const pauseBtn = document.getElementById('pause');
    const clearBtn = document.getElementById('clear');
    const themeBtn = document.getElementById('theme');
    const closeBtn = document.getElementById('close');
    const toolsToggleBtn = document.getElementById('tools-toggle');
    const searchToggleBtn = document.getElementById('search-toggle');
    const searchbar = document.getElementById('searchbar');
    const searchInput = document.getElementById('search-input');
    const searchCount = document.getElementById('search-count');
    const searchPrevBtn = document.getElementById('search-prev');
    const searchNextBtn = document.getElementById('search-next');
    const searchCloseBtn = document.getElementById('search-close');
    const chips = document.getElementById('chips');
    // All four kinds are enabled by default.
    const filters = new Set(['reasoning', 'assistant', 'tool', 'user']);
    let paused = false;
    let autoScroll = true;
    let queue = [];
    let playing = false;
    // Registry of rendered entries, used by search and the tool-call index.
    const allItems = [];
    let searchMatches = [];
    let searchCur = 0;
    let activeQuery = '';

    // ---- Theme: auto follows the OS, manual choice is persisted ----
    const THEME_KEY = 'codex-reasoning-sidebar-theme';
    const THEME_ORDER = ['auto', 'light', 'dark'];
    const THEME_LABEL = { auto: '自动', light: '浅色', dark: '深色' };
    const media = matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(mode) {
      const dark = mode === 'dark' || (mode === 'auto' && media.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      themeBtn.textContent = THEME_LABEL[mode];
      themeBtn.classList.toggle('on', mode !== 'auto');
    }
    let themeMode = THEME_ORDER.includes(localStorage.getItem(THEME_KEY))
      ? localStorage.getItem(THEME_KEY)
      : 'auto';
    applyTheme(themeMode);
    media.addEventListener('change', () => {
      if (themeMode === 'auto') applyTheme('auto');
    });
    themeBtn.addEventListener('click', () => {
      themeMode = THEME_ORDER[(THEME_ORDER.indexOf(themeMode) + 1) % THEME_ORDER.length];
      localStorage.setItem(THEME_KEY, themeMode);
      applyTheme(themeMode);
    });

    // Inside the pywebview floating window: close button + resize grip.
    function showCloseIfFloating() {
      if (window.pywebview && window.pywebview.api && window.pywebview.api.quit) {
        closeBtn.hidden = false;
        closeBtn.addEventListener('click', () => window.pywebview.api.quit());
        initResizeGrip();
      }
    }
    showCloseIfFloating();
    window.addEventListener('pywebviewready', showCloseIfFloating);

    function initResizeGrip() {
      const grip = document.getElementById('grip');
      if (!grip || grip.dataset.init) return;
      grip.dataset.init = '1';
      grip.hidden = false;

      let dragging = false;
      let lastX = 0, lastY = 0, accX = 0, accY = 0, lastSent = 0;
      const dpr = () => window.devicePixelRatio || 1;

      const flush = () => {
        if (!accX && !accY) return;
        // CSS px -> physical px; the right edge stays anchored in Python.
        window.pywebview.api.resize_by(Math.round(accX * dpr()), Math.round(accY * dpr()));
        accX = accY = 0;
      };

      grip.addEventListener('pointerdown', (e) => {
        dragging = true;
        lastX = e.clientX; lastY = e.clientY;
        lastSent = performance.now();
        grip.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      grip.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        accX += e.clientX - lastX;
        accY += e.clientY - lastY;
        lastX = e.clientX; lastY = e.clientY;
        const now = performance.now();
        if (now - lastSent >= 50) { flush(); lastSent = now; }
      });
      const end = async () => {
        if (!dragging) return;
        dragging = false;
        flush();
        try {
          const size = await window.pywebview.api.get_size();
          if (size && size.w) localStorage.setItem('codex-reasoning-float-size', JSON.stringify(size));
        } catch {}
      };
      grip.addEventListener('pointerup', end);
      grip.addEventListener('pointercancel', end);

      // Restore the size chosen last time.
      try {
        const saved = JSON.parse(localStorage.getItem('codex-reasoning-float-size') || 'null');
        if (saved && saved.w && saved.h) window.pywebview.api.apply_size(saved.w, saved.h);
      } catch {}
    }

    function fmt(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    // Scroll an entry into view and flash it; reveal it if its filter is off.
    function locate(el) {
      if (!el || !el.isConnected) return;
      if (el.style.display === 'none') el.style.display = '';
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('flash');
    }

    function restoreBody(el) {
      const body = el && el.querySelector('.body');
      if (body && el.dataset.done && el._text !== undefined) body.textContent = el._text;
    }

    function applyMarks(el) {
      const body = el && el.querySelector('.body');
      if (!body || !el.dataset.done || !activeQuery || el._text === undefined) return;
      const text = el._text;
      const low = text.toLowerCase();
      const qlen = activeQuery.length;
      let html = '';
      let i = 0;
      while (true) {
        const at = low.indexOf(activeQuery, i);
        if (at < 0) { html += esc(text.slice(i)); break; }
        html += esc(text.slice(i, at)) + '<mark>' + esc(text.substr(at, qlen)) + '</mark>';
        i = at + qlen;
      }
      body.innerHTML = html;
    }

    function updateSearchCount() {
      searchCount.textContent = searchMatches.length
        ? (searchCur + 1) + '/' + searchMatches.length
        : (activeQuery ? '0/0' : '');
    }

    function runSearch(keepCur) {
      activeQuery = searchInput.value.trim().toLowerCase();
      for (const it of allItems) restoreBody(it.el);
      if (!activeQuery) {
        searchMatches = [];
        searchCur = 0;
        updateSearchCount();
        return;
      }
      searchMatches = allItems.filter((it) => it.text.toLowerCase().includes(activeQuery));
      if (!keepCur || searchCur >= searchMatches.length) searchCur = 0;
      for (const it of searchMatches) applyMarks(it.el);
      updateSearchCount();
      if (searchMatches.length) locate(searchMatches[searchCur].el);
    }

    function stepSearch(dir) {
      if (!searchMatches.length) return;
      searchCur = (searchCur + dir + searchMatches.length) % searchMatches.length;
      updateSearchCount();
      locate(searchMatches[searchCur].el);
    }

    function openSearch() {
      searchbar.hidden = false;
      searchInput.focus();
      searchInput.select();
    }

    function closeSearch() {
      searchbar.hidden = true;
      activeQuery = '';
      searchMatches = [];
      searchCur = 0;
      updateSearchCount();
      for (const it of allItems) restoreBody(it.el);
    }

    function addToolChip(item, el) {
      if (chips.hidden) return;
      const chip = document.createElement('button');
      chip.className = 'chip';
      const name = item.text.slice(0, item.text.indexOf('(')).trim() || item.text.slice(0, 24);
      chip.textContent = fmt(item.ts) + ' ' + name;
      chip.title = item.text.slice(0, 300);
      chip.addEventListener('click', () => locate(el));
      chips.appendChild(chip);
      while (chips.children.length > 30) chips.firstElementChild.remove();
      chips.scrollLeft = chips.scrollWidth;
    }

    function renderTyping(item, done) {
      const empty = feed.querySelector('.empty');
      if (empty) empty.remove();
      const el = document.createElement('div');
      el.className = 'item ' + item.kind;
      const label = {
        reasoning: '思考',
        assistant: '回复',
        tool: '工具',
        user: '我',
        system: '系统',
      }[item.kind] || item.kind;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      const time = document.createElement('span');
      time.textContent = fmt(item.ts);
      meta.append(tag, time);
      const body = document.createElement('div');
      body.className = 'body';
      el.append(meta, body);
      feed.appendChild(el);
      el._text = item.text;
      allItems.push({ kind: item.kind, ts: item.ts, text: item.text, el });
      while (allItems.length > 300) allItems.shift();
      if (item.kind === 'tool') addToolChip(item, el);
      while (feed.children.length > 300) feed.firstElementChild.remove();

      const text = item.text;
      const step = text.length > 400 ? 3 : 2;
      const speed = text.length > 400 ? 10 : 16;
      let idx = 0;
      let finished = false;

      const finish = () => {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        body.textContent = text;
        el.dataset.done = '1';
        if (activeQuery && text.toLowerCase().includes(activeQuery)) {
          searchMatches = allItems.filter((it) => it.text.toLowerCase().includes(activeQuery));
          if (searchCur >= searchMatches.length) searchCur = 0;
          applyMarks(el);
          updateSearchCount();
        }
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        done();
      };

      const timer = setInterval(() => {
        if (paused) return;
        idx = Math.min(text.length, idx + step);
        body.textContent = text.slice(0, idx);
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        if (idx >= text.length) finish();
      }, speed);

      el.addEventListener('click', finish);
    }

    function playNext() {
      if (paused) return;
      if (!queue.length) {
        playing = false;
        return;
      }
      playing = true;
      const item = queue.shift();
      renderTyping(item, playNext);
    }

    function enqueue(item) {
      if (!filters.has(item.kind)) return;
      queue.push(item);
      if (!playing) playNext();
    }

    function applyFilters() {
      for (const el of feed.querySelectorAll('.item')) {
        el.style.display = filters.has(el.classList[1]) || filters.has('system') && el.classList.contains('system') ? '' : 'none';
      }
    }

    document.querySelectorAll('.filters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.filter;
        if (filters.has(key)) { filters.delete(key); btn.classList.remove('on'); }
        else { filters.add(key); btn.classList.add('on'); }
        applyFilters();
      });
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? '继续' : '暂停';
      pauseBtn.classList.toggle('on', paused);
      if (!paused && !playing && queue.length) playNext();
    });

    clearBtn.addEventListener('click', () => {
      queue = [];
      playing = false;
      feed.innerHTML = '<div class="empty">已清空</div>';
      allItems.length = 0;
      chips.innerHTML = '';
      searchMatches = [];
      searchCur = 0;
      updateSearchCount();
    });

    toolsToggleBtn.addEventListener('click', () => {
      chips.hidden = !chips.hidden;
      toolsToggleBtn.classList.toggle('on', !chips.hidden);
      if (!chips.hidden) {
        chips.innerHTML = '';
        for (const it of allItems) {
          if (it.kind === 'tool') addToolChip(it, it.el);
        }
      }
    });

    searchToggleBtn.addEventListener('click', openSearch);
    searchInput.addEventListener('input', () => runSearch(false));
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); stepSearch(e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
      else if (e.key === 'F3') { e.preventDefault(); stepSearch(1); }
    });
    searchPrevBtn.addEventListener('click', () => stepSearch(-1));
    searchNextBtn.addEventListener('click', () => stepSearch(1));
    searchCloseBtn.addEventListener('click', closeSearch);

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
        e.preventDefault();
        openSearch();
      } else if ((e.ctrlKey || e.metaKey) && (e.key === 'g' || e.key === 'G')) {
        e.preventDefault();
        if (!searchbar.hidden) stepSearch(1);
      } else if (e.key === 'F3') {
        e.preventDefault();
        if (!searchbar.hidden) stepSearch(1);
      } else if (e.key === 'Escape' && !searchbar.hidden && document.activeElement !== searchInput) {
        closeSearch();
      }
    });

    feed.addEventListener('scroll', () => {
      autoScroll = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 30;
    });

    const es = new EventSource('/events');
    es.onmessage = (ev) => {
      const item = JSON.parse(ev.data);
      if (item.kind === 'system') {
        status.textContent = item.text;
        return;
      }
      enqueue(item);
    };
    es.onerror = () => {
      status.textContent = '连接断开，重连中...';
    };
    fetch('/api/session').then((r) => r.json()).then((d) => {
      if (!d.session) return;
      const short = d.session.slice(0, 4) + '…' + d.session.slice(-4);
      status.textContent = (d.label ? `已监听 ${d.label}（${short}）` : `已监听会话 ${short}`);
    }).catch(() => {});
  </script>
</body>
</html>
