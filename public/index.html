<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>思维链</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #181b22;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --muted: #8b93a5;
      --blue: #6ea8ff;
      --green: #7ddc9b;
      --orange: #e8a45c;
      --pink: #f08ab0;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font: 13px/1.55 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      flex: 0 0 auto;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      margin: 0;
    }
    .spacer { flex: 1; }
    .status {
      color: var(--muted);
      font-size: 11px;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    button {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      cursor: pointer;
    }
    button:hover { color: var(--text); border-color: #3a4150; }
    button.on { color: var(--blue); border-color: var(--blue); }
    .filters {
      display: flex;
      gap: 6px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
      flex-wrap: wrap;
    }
    .filters button { padding: 3px 8px; }
    main {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 20px;
    }
    .item {
      border-left: 2px solid var(--line);
      padding: 6px 10px 6px 12px;
      margin: 0 0 10px;
      border-radius: 0 6px 6px 0;
      background: var(--panel);
      white-space: pre-wrap;
      word-break: break-word;
      animation: pop 0.15s ease-out;
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: none; }
    }
    .item .meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-size: 11px;
      color: var(--muted);
    }
    .tag {
      font-size: 10px;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }
    .reasoning { border-left-color: var(--blue); }
    .reasoning .tag { color: var(--blue); background: rgba(110,168,255,0.12); }
    .assistant { border-left-color: var(--green); }
    .assistant .tag { color: var(--green); background: rgba(125,220,155,0.12); }
    .tool { border-left-color: var(--orange); }
    .tool .tag { color: var(--orange); background: rgba(232,164,92,0.12); }
    .user { border-left-color: var(--pink); }
    .user .tag { color: var(--pink); background: rgba(240,138,176,0.12); }
    .system { border-left-color: var(--muted); color: var(--muted); font-size: 11px; }
    .item .body { font-size: 12px; color: #c9cfdb; }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 40px 10px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>思维链</h1>
    <div class="spacer"></div>
    <span class="status" id="status">连接中...</span>
    <button id="pause">暂停</button>
    <button id="clear">清空</button>
  </header>
  <div class="filters">
    <button data-filter="reasoning" class="on">思考</button>
    <button data-filter="assistant">回复</button>
    <button data-filter="tool">工具</button>
    <button data-filter="user">我</button>
  </div>
  <main id="feed">
    <div class="empty">等待思维链...</div>
  </main>
  <script>
    const feed = document.getElementById('feed');
    const status = document.getElementById('status');
    const pauseBtn = document.getElementById('pause');
    const clearBtn = document.getElementById('clear');
    const filters = new Set(['reasoning']);
    let paused = false;
    let autoScroll = true;
    let queue = [];
    let playing = false;

    function fmt(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      return d.toLocaleTimeString('zh-CN', { hour12: false });
    }

    function renderTyping(item, done) {
      const empty = feed.querySelector('.empty');
      if (empty) empty.remove();
      const el = document.createElement('div');
      el.className = 'item ' + item.kind;
      const label = {
        reasoning: '思考',
        assistant: '回复',
        tool: '工具',
        user: '我',
        system: '系统',
      }[item.kind] || item.kind;
      const meta = document.createElement('div');
      meta.className = 'meta';
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = label;
      const time = document.createElement('span');
      time.textContent = fmt(item.ts);
      meta.append(tag, time);
      const body = document.createElement('div');
      body.className = 'body';
      el.append(meta, body);
      feed.appendChild(el);
      while (feed.children.length > 300) feed.firstElementChild.remove();

      const text = item.text;
      const step = text.length > 400 ? 3 : 2;
      const speed = text.length > 400 ? 10 : 16;
      let idx = 0;
      let finished = false;

      const finish = () => {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        body.textContent = text;
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        done();
      };

      const timer = setInterval(() => {
        if (paused) return;
        idx = Math.min(text.length, idx + step);
        body.textContent = text.slice(0, idx);
        if (autoScroll) feed.scrollTop = feed.scrollHeight;
        if (idx >= text.length) finish();
      }, speed);

      el.addEventListener('click', finish);
    }

    function playNext() {
      if (paused) return;
      if (!queue.length) {
        playing = false;
        return;
      }
      playing = true;
      const item = queue.shift();
      renderTyping(item, playNext);
    }

    function enqueue(item) {
      if (!filters.has(item.kind)) return;
      queue.push(item);
      if (!playing) playNext();
    }

    function applyFilters() {
      for (const el of feed.querySelectorAll('.item')) {
        el.style.display = filters.has(el.classList[1]) || filters.has('system') && el.classList.contains('system') ? '' : 'none';
      }
    }

    document.querySelectorAll('.filters button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.filter;
        if (filters.has(key)) { filters.delete(key); btn.classList.remove('on'); }
        else { filters.add(key); btn.classList.add('on'); }
        applyFilters();
      });
    });

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? '继续' : '暂停';
      pauseBtn.classList.toggle('on', paused);
      if (!paused && !playing && queue.length) playNext();
    });

    clearBtn.addEventListener('click', () => {
      queue = [];
      playing = false;
      feed.innerHTML = '<div class="empty">已清空</div>';
    });

    feed.addEventListener('scroll', () => {
      autoScroll = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 30;
    });

    const es = new EventSource('/events');
    es.onmessage = (ev) => {
      const item = JSON.parse(ev.data);
      if (item.kind === 'system') {
        status.textContent = item.text;
        return;
      }
      enqueue(item);
    };
    es.onerror = () => {
      status.textContent = '连接断开，重连中...';
    };
    fetch('/api/session').then((r) => r.json()).then((d) => {
      if (d.session) status.textContent = '已监听会话 ' + d.session;
    }).catch(() => {});
  </script>
</body>
</html>
